<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crew Lookahead</title>
<meta name="description" content="Jobs, crew, material and messages for the team.">
<meta name="theme-color" content="#18212b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Crew Lookahead">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
/* Layout: field lookahead binder — sticky tab bar (Dashboard / Board / Jobs / Crew / Messages / Material), one column of panels, forms in a bottom sheet */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#18212b; --muted:#5d6977; --line:#d5dbe2;
  --accent:#1f5fbf; --accent-ink:#ffffff; --soft:#e3ebf7;
  --idea:#9aa6b4; --likely:#e0a12b; --amber-ink:#9a6200; --locked:#1f5fbf; --over:#c8372d; --over-soft:#fbe7e5; --ok:#2f8a57; --ok-soft:#e2f2e8; --quick:#7b4ac4; --quick-soft:#efe7fa;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161c; --panel:#19212a; --ink:#e6ebf0; --muted:#97a3b0; --line:#2b3540;
  --accent:#5b9bf2; --accent-ink:#0b1420; --soft:#1d2b3d;
  --idea:#6b7785; --likely:#e7ad3c; --amber-ink:#f0c060; --locked:#5b9bf2; --over:#ef6a5e; --over-soft:#3a1f1d; --ok:#5cc28a; --ok-soft:#173326; --quick:#b896f0; --quick-soft:#2a2140; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --panel:#19212a; --ink:#e6ebf0; --muted:#97a3b0; --line:#2b3540;
  --accent:#5b9bf2; --accent-ink:#0b1420; --soft:#1d2b3d;
  --idea:#6b7785; --likely:#e7ad3c; --amber-ink:#f0c060; --locked:#5b9bf2; --over:#ef6a5e; --over-soft:#3a1f1d; --ok:#5cc28a; --ok-soft:#173326; --quick:#b896f0; --quick-soft:#2a2140; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:900px;margin:0 auto;display:grid;gap:16px}
.wrap.wide{max-width:1240px}
.dash{columns:290px;column-gap:12px}
.dash>.dpanel{break-inside:avoid;margin-bottom:12px;width:100%}
.dpanel.full{margin-bottom:12px}
.dpanel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;align-content:start;min-width:0}
.dpanel.link{cursor:pointer;transition:border-color .15s,box-shadow .15s}
.dpanel.link:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.dpanel.alertp{border-color:var(--over)}
.dph{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dph h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:1.05rem;text-transform:uppercase;letter-spacing:.04em;display:flex;gap:8px;align-items:center}
.dph .go{font-size:.8rem;color:var(--muted);white-space:nowrap}
.dpanel.link:hover .dph .go{color:var(--accent)}
.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.mini div{background:var(--bg);border-radius:8px;padding:7px 8px}
.mini b{display:block;font:500 1.25rem/1.1 var(--f-mono)}
.mini span{font-size:.64rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.mini .bad b{color:var(--over)}
.rows{display:grid}
.rowi{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:.9rem;min-width:0}
.rowi:first-child{border-top:0;padding-top:0}
.rowi .l{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowi .l small{display:block;color:var(--muted);font-size:.78rem;overflow:hidden;text-overflow:ellipsis}
.rowi .r{flex:none;font-size:.8rem;color:var(--muted);font-family:var(--f-mono)}
.rowi .r.bad{color:var(--over);font-weight:600}
.dot2{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px;background:var(--locked)}
.dot2.p1{background:var(--over)}.dot2.p2{background:var(--likely)}.dot2.p4{background:var(--idea)}
.more{font-size:.8rem;color:var(--muted)}
.okline{font-size:.9rem;color:var(--ok)}
.dpanel .mtable td{padding:6px 8px}.dpanel .mtable th{padding:4px 8px}
header{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:700;font-size:2.4rem;line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase}
.sub{color:var(--muted);margin:4px 0 0;font-size:.9rem}
.status{font-size:.82rem;color:var(--muted)}
button{font:inherit;cursor:pointer;color:inherit}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 14px;font-weight:600;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn.danger{background:var(--over);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px;display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:8px 12px;border-radius:8px;font-weight:600;font-size:.92rem;color:var(--muted);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.badge{font:600 .7rem var(--f-mono);background:var(--over);color:#fff;border-radius:999px;padding:1px 6px;min-width:18px;text-align:center}
.badge.calm{background:var(--accent);color:var(--accent-ink)}
h2{font-family:var(--f-display);font-weight:600;font-size:1.25rem;text-transform:uppercase;letter-spacing:.04em;margin:0}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;margin-bottom:10px}
.sechead .tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.stack{display:grid;gap:8px}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:24px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.empty strong{display:block;color:var(--ink);margin-bottom:4px}
.seg-ctl{display:inline-grid;grid-auto-flow:column;gap:2px;background:var(--line);padding:2px;border-radius:9px}
.seg-ctl button{border:0;background:transparent;border-radius:7px;padding:6px 12px;font-size:.85rem;font-weight:600;color:var(--muted)}
.seg-ctl button[aria-pressed="true"]{background:var(--panel);color:var(--ink)}
.nav{display:flex;align-items:center;gap:6px}
.nav .lbl{font-family:var(--f-display);font-weight:600;font-size:1.15rem;min-width:9ch;text-align:center}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;width:34px;height:34px;display:inline-grid;place-items:center;font-size:1rem}
.pill{display:inline-block;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:999px;vertical-align:1px}
.pill.locked{background:var(--soft);color:var(--locked)} .pill.likely{background:color-mix(in srgb,var(--likely) 20%,transparent)} .pill.idea{background:color-mix(in srgb,var(--idea) 22%,transparent)}
.pill.bad{background:var(--over-soft);color:var(--over)} .pill.good{background:var(--ok-soft);color:var(--ok)} .pill.plain{background:var(--soft);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:var(--bg)}
.chip.warn{border-color:var(--over);color:var(--over)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
/* month */
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.mhd{font:600 .7rem var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center;padding:2px 0}
header h1{font-size:1.75rem}
.subnav{display:inline-flex;gap:2px;background:var(--line);padding:2px;border-radius:9px;flex-wrap:wrap}
.subnav button{border:0;background:transparent;border-radius:7px;padding:6px 14px;font-size:.88rem;font-weight:600;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.subnav button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.myday{display:flex;gap:4px 12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--soft);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.myday .lbl{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.myday .what{font-weight:600;font-size:1.02rem}
.days{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.drow{display:grid;grid-template-columns:64px minmax(0,1fr);border-top:1px solid var(--line)}
.drow:first-child{border-top:0}
.drow.today{background:color-mix(in srgb,var(--accent) 6%,var(--panel))}
.drow.today .dhd{color:var(--accent)}
.dhd{border:0;background:none;padding:12px 0 12px 14px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;color:var(--ink)}
.dw{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;opacity:.75}
.dn{font:600 1.6rem/1.05 var(--f-display)}
.dbody{padding:10px 14px 10px 4px;display:grid;gap:6px;align-content:start;min-width:0}
.jl{display:grid;gap:1px;text-align:left;border:0;background:var(--bg);border-left:4px solid var(--locked);border-radius:6px;padding:7px 10px;width:100%}
.jl.p1{border-left-color:var(--over)} .jl.p2{border-left-color:var(--likely)} .jl.p4{border-left-color:var(--idea)}
.jl:hover{background:var(--soft)}
.jn{font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.jc{font-size:.86rem;color:var(--muted);overflow-wrap:anywhere}
.jc strong{color:var(--ink)}
.offline{font-size:.8rem;color:var(--muted);padding-left:2px}
.small{font-size:.85rem}
.mtable{width:100%;border-collapse:collapse;font-size:.92rem}
.mtable th{font:600 .68rem var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:right;padding:6px 10px}
.mtable th:first-child,.mtable td:first-child{text-align:left}
.mtable td{padding:10px;border-top:1px solid var(--line);text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mtable td:first-child{font-family:var(--f-body);font-weight:600}
.mtable tbody tr{cursor:pointer}
.mtable tr.sel td{background:var(--soft)}
.mtable td.gap.bad{color:var(--over);font-weight:600}
.mtable td.gap.ok{color:var(--ok)}
.staff{display:grid;gap:3px;padding:10px 0;border-top:1px solid var(--line)}
.staff:first-child{border-top:0;padding-top:0}
.staff .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.cnt{font:500 .95rem var(--f-mono)} .cnt.short{color:var(--over);font-weight:600}
.cardact{grid-column:2/4;display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.mchip.p1{background:var(--over);color:#fff} .mchip.p2{background:var(--likely);color:#1b1404} .mchip.p3{background:var(--locked);color:var(--accent-ink)} .mchip.p4{background:transparent;border:1px solid var(--idea);color:var(--ink)}
.rail.p1{background:var(--over)} .rail.p2{background:var(--likely)} .rail.p3{background:var(--locked)} .rail.p4{background:var(--idea)}
.mcell{background:var(--panel);border:1px solid var(--line);border-radius:6px;min-height:92px;padding:4px;display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0}
.mcell.out{opacity:.45}
.mcell.wkend{background:var(--bg)}
.mcell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mcell.short{background:var(--over-soft)}
.mday{font:500 .8rem var(--f-mono);display:flex;justify-content:space-between;gap:2px}
.mday .off{font-size:.65rem;color:var(--muted)}
.mchip{font-size:.68rem;line-height:1.3;border-radius:3px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.mchip.locked{background:var(--locked);color:var(--accent-ink)} .mchip.likely{background:var(--likely);color:#1b1404} .mchip.idea{background:transparent;border:1px dashed var(--idea);color:var(--ink)}
.mfoot{margin-top:auto;font:500 .66rem var(--f-mono);color:var(--muted)}
.mcell.short .mfoot{color:var(--over);font-weight:600}
@media (max-width:560px){.mchip{font-size:0;height:5px;padding:0}.mcell{min-height:64px}.mday .off{display:none}}
/* week/day */
.daybox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.daybox.short{border-color:var(--over)}
.daybox.today{box-shadow:inset 3px 0 0 var(--accent)}
.dayhd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.dayhd button{border:0;background:none;padding:0;font-family:var(--f-display);font-weight:600;font-size:1.1rem;text-transform:uppercase;letter-spacing:.03em}
.jline{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:.9rem}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none}
.dot.locked{background:var(--locked)} .dot.likely{background:var(--likely)} .dot.idea{border:1px dashed var(--idea)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile b{display:block;font:500 1.6rem var(--f-mono);line-height:1.1}
.tile span{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tile.bad b{color:var(--over)}
/* 12wk strip */
.strip-scroll{overflow-x:auto}
.strip{display:grid;grid-template-columns:repeat(12,minmax(44px,1fr));gap:6px;min-width:560px;align-items:end}
.wk{display:grid;gap:6px;justify-items:center}
.bar-box{position:relative;height:140px;width:100%;display:flex;flex-direction:column-reverse;border-bottom:1px solid var(--line)}
.seg{width:100%}
.seg.locked{background:var(--locked)} .seg.likely{background:var(--likely)} .seg.idea{background:repeating-linear-gradient(135deg,var(--idea) 0 4px,transparent 4px 7px);border:1px solid var(--idea)}
.cap{position:absolute;left:-3px;right:-3px;border-top:2px dashed var(--ink);opacity:.55}
.num{font:500 .9rem var(--f-mono)}
.wk.over .num{color:var(--over);font-weight:600}
.wk.over .bar-box{background:var(--over-soft)}
.wkl{font:400 .7rem var(--f-mono);color:var(--muted);text-align:center;line-height:1.2}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:2px;display:inline-block}
.alert{padding:10px 12px;border-radius:8px;background:var(--over-soft);font-size:.88rem;border-left:4px solid var(--over)}
.note{padding:10px 12px;border-radius:8px;background:var(--soft);font-size:.88rem}
/* job cards */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:.85rem}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.month{font:600 .75rem var(--f-body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:8px 0 0}
.card{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:2px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px 12px 0;text-align:left;width:100%;overflow:hidden}
.card .rail{grid-row:1/5;border-radius:0 3px 3px 0}
.rail.locked{background:var(--locked)} .rail.likely{background:var(--likely)} .rail.idea{background:var(--idea)} .rail.plain{background:var(--line)} .rail.bad{background:var(--over)}
.card h3{margin:0;font-size:1rem;font-weight:600;overflow-wrap:anywhere}
.card .meta{color:var(--muted);font-size:.85rem;grid-column:2}
.card .body{grid-column:2/4;font-size:.88rem;white-space:pre-wrap;overflow-wrap:anywhere}
.card .side{grid-row:1/3;grid-column:3;text-align:right}
.side b{display:block;font:500 1.4rem var(--f-mono);line-height:1}
.side span{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
/* messages */
.composer{display:grid;gap:8px}
.composer textarea{min-height:70px}
.crow{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.crow .field{flex:1 1 140px}
.msg{display:grid;gap:4px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.msg.mine{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.msg .top{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.msg .top strong{color:var(--ink)}
.msg .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.rem{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line)}
.rem.due{border-color:var(--over);background:var(--over-soft)}
.rem input{margin-top:3px;width:18px;height:18px;flex:none}
.rem .rtxt{flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.linkbtn{border:0;background:none;padding:0;color:var(--muted);font-size:.8rem;text-decoration:underline}
/* material */
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.mrow.low{border-color:var(--over)}
.mrow .nm{border:0;background:none;padding:0;text-align:left;font-weight:600;overflow-wrap:anywhere}
.mrow .sub2{font-size:.8rem;color:var(--muted)}
.qty{display:flex;align-items:center;gap:4px}
.qty .q{font:500 1.1rem var(--f-mono);min-width:3.5ch;text-align:center}
.qty .u{font-size:.75rem;color:var(--muted);min-width:3ch}
.search{flex:1 1 180px}
/* forms */
.field{display:grid;gap:4px;min-width:0}
.field label,.flabel{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.field input,.field select,.field textarea,.search input,.inline input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.field textarea{min-height:80px;resize:vertical}
.check{display:flex;align-items:center;gap:8px;font-size:.92rem}
.check input{width:18px;height:18px}
.inline{display:flex;gap:6px}
.inline input{flex:1;min-width:0}
.scrim{position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:14px 14px 0 0;

  master.getRange(3, 1, 1, rows[0].length).setFontWeight("bold").setBackground(HEAD_FILL);

function cableTab_(ss, sh, name, c, data) {

  block("Check list", ["Item", "Owner", "Date", "Remarks"], c.checks);

function tab_(ss, name, index) {

  return sh;
}

function csvTab_(ss, name, csv) {
  if (!csv) return;
  const sh = tab_(ss, name, ss.getNumSheets());
  const data = Utilities.parseCsv(csv);
  const w = Math.max.apply(null, data.map(r => r.length));
  data.forEach(r => { while (r.length < w) r.push(""); });
  sh.clear();
  sh.getRange(1, 1, data.length, w).setNumberFormat("@").setValues(data);
  sh.getRange(1, 1, 1, w).setFontWeight("bold").setBackground(HEAD_FILL);

function tabName_(name, seen) {

function bar_(done, total) {

  const n = Math.round(done / total * 10);

let importData=null;
async function loadImport(){importData={};try{const r=await fetch("import-data.json",{cache:"no-store"});if(r.ok)importData=await r.json();}catch(e){}schedule();}
function importMissing(){const out={n:0,techs:0,timeoff:0,jobs:0,holidays:0};if(!importData)return out;
  (Array.isArray(importData.holidays)?importData.holidays:[]).forEach(x=>{if(x.date&&!holidayOn(x.date)){out.holidays++;out.n++;}});
  for(const [col,docs] of Object.entries(importData)){if(!(col in out)||!S[col])continue;const have=new Set(S[col].map(x=>x.id));
    const names=col==="techs"?new Set(S.techs.map(t=>(t.name||"").trim().toLowerCase())):null;
    for(const [id,d] of Object.entries(docs)){if(have.has(id))continue;if(names&&names.has((d.name||"").trim().toLowerCase()))continue;out[col]++;out.n++;}}
  return out;}
async function importOld(btn){btn.disabled=true;btn.textContent="Adding…";
  try{if(!importData||!Object.keys(importData).length)await loadImport();const b=db.batch();let n=0;
    const nameToId={};S.techs.forEach(t=>nameToId[(t.name||"").trim().toLowerCase()]=t.id);
    const remap={};
    for(const [id,d] of Object.entries(importData.techs||{})){const ex=nameToId[(d.name||"").trim().toLowerCase()];if(ex&&ex!==id)remap[id]=ex;}
    for(const [col,docs] of Object.entries(importData)){if(!S[col])continue;const have=new Set(S[col].map(x=>x.id));
      for(const [id,d0] of Object.entries(docs)){if(have.has(id)||(col==="techs"&&remap[id]))continue;
        const d=Object.assign({},d0);if(col==="timeoff"&&remap[d.techId])d.techId=remap[d.techId];
        b.set(db.collection(col).doc(id),d);n++;}}

{const hs=location.hash.slice(1);if(hs==="asks"){msgSeg="asks";tab="messages";}else tab=OLD_TABS[hs]||(TABS.includes(hs)?hs:"home");}

const offSyncing=new Set();

async function startSession(u){

  unsubs.push(pr.onSnapshot(s=>{me_=s.exists?(s.data()||{}):{};if(me_.name)$("#whoMe").textContent=me_.name;schedule();},()=>{}));

  if(!em||!pw){loginErr("Enter your email and password.");return;}if(createMode&&!nm){loginErr("Add your name so the team knows who you are.");return;}

  catch(err){pendingName="";loginErr(authMsg(err));}finally{b.disabled=false;}});
$("#gBtn").addEventListener("click",async()=>{loginErr("");const prov=new firebase.auth.GoogleAuthProvider();
  try{await auth.signInWithPopup(prov);}catch(e){if(e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")){auth.signInWithRedirect(prov);return;}loginErr(authMsg(e));}});

const cfg=window.FIREBASE_CONFIG;

    if(!u){$("#login").hidden=false;$("#signOut").hidden=true;$("#whoMe").textContent="";$("#status").textContent="Signed out";render();return;}
    $("#login").hidden=true;$("#status").textContent="Connecting…";render();startSession(u);});
